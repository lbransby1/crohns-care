services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      MPLBACKEND: Agg
      ANONYMIZED_TELEMETRY: "False"
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-qwen-3.8-27b}
